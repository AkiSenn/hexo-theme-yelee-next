# ============================================================================
#  yelee-next · 主题默认配置
#  ---------------------------------------------------------------------------
#  /  Theme default configuration  /
#
#  · 这里只放「主题默认值」。凡是需要你自己填的内容（作者、社交链接、备案号、
#    统计 ID、评论仓库…）一律留空 —— 留空就不显示，填了才出现，不会留空白框。
#  · 推荐把自定义配置写在**站点根目录**的 _config.yelee-next.yml（Hexo 原生支持，
#    升级主题不会丢）。可直接复制示例：
#        cp themes/yelee-next/docs/starter-config.yml  <站点>/_config.yelee-next.yml
#  · 优先级：站点 _config.yelee-next.yml  >  本文件  >  内置默认值
#    （内置默认值见 themes/yelee-next/scripts/00-config.js 的 DEFAULTS）
#  · 改完配置建议 hexo clean && hexo g（主题配置变化不触发增量重建）。
# ============================================================================

# 主题版本号，会显示在页脚署名里：Hexo · Yelee Next 4.0.0（AkiSenn & MOxFIVE）
version: 4.0.0

# ----------------------------------------------------------------- 个人信息
# / Profile /  需要你自己填的内容默认留空
profile:
  author:                        # 侧栏署名 / 页脚版权署名；留空则用站点 config.author
  subtitle:                      # 侧栏签名；留空则用站点 config.subtitle
  email:                         # 留空则用站点 config.email
  avatar: /img/avatar.png        # 头像：默认是主题自带的鲸鱼占位图（🐋），
                                 #   换成自己的：把图放主题 source/img/ 下改这里，
                                 #   或直接写 https://... 外链
  favicon: /img/favicon.png      # 站点图标
  apple_touch_icon:              # iOS 添加到主屏幕的图标，留空用 /img/apple-touch-icon.png
  since:                         # 建站年份，决定页脚版权起始年：
                                 #   填 2020 → © 2020-2026（结束年取构建时的当前年）
                                 #   填 2025 → © 2025-2026；留空则只显示 © 2026
                                 #   留空时也会回落到 footer.runtime.since 的年份
  aboutme:                       # 侧栏「关于我」，支持一层 HTML；留空则不显示该页签

# ------------------------------------------------------------------ 导航菜单
# key 是显示文案，value 是路径。也可写成 { path: /archives/, icon: archive, new_tab: false }
# 内置图标名见 layout/_partial/icons.ejs（home/list/tag/folder/user/file/book/...）
menu:
  主页: /
  所有文章: /archives/
  标签云: /tags/
  关于我: /about/

# ---------------------------------------------------------------- 社交图标
# 留空（或删掉）就不显示社交图标区 —— 填几个显示几个。
# key 按名字匹配内置 SVG 图标，匹配不到则显示名字首字母徽标。
# 可用名字：GitHub / Email(mail) / RSS / Twitter(X) / Telegram / bilibili / weibo /
#          zhihu / douban / netease(网易云音乐) / qq / wechat / jianshu / csdn /
#          v2ex / youtube / codepen / wordpress / globe(通用)
subnav: {}
# ⚠️ 填你自己的账号 —— 不要照抄文档/演示里出现过的任何链接，那些都不是你的。
#    留空（或删掉整个 subnav）→ 侧栏**不显示社交图标区**，页面上不会留空白。
# 例：
# subnav:
#   Email: mailto:you@example.com
#   GitHub: https://github.com/yourname
#   RSS: /atom.xml
#   bilibili: https://space.bilibili.com/000000000

# 友情链接（侧栏「友链」页签；留空则不显示该页签）
friends: {}
# 例：
# friends:
#   Hexo: https://hexo.io

# -------------------------------------------------------------------- 外观
appearance:
  base_font_size: 16             # 根字号(px)，正文按 rem 缩放
  sidebar_width: 300             # 左侧栏宽度(px)，>=1080px 时生效
  width: 1000                    # 内容区最大宽度(px)
  background_image: 6            # 背景大图：数字 = 从 source/background/bg-1..N.webp
                                 #   按页面固定选一张；也可写路径数组；false 关闭
  background_overlay: 0.3        # 背景遮罩 0~1，越大越暗（保证文字对比度）
  color_scheme: auto             # 默认配色：auto(跟随系统) | light | dark
  theme_switch: true             # 显示浅色/深色/跟随系统切换按钮
  animate: true                  # 首页文章入场动画（复刻原版：未进视口时不可见）
  reading_progress: true         # 顶部阅读进度条
  accent:                        # 主色，留空用内置 #5b8def
  radius: 14                     # 卡片圆角(px)
  font_family:                   # 正文字体，留空用系统字体栈（零字体请求）
  code_font:                     # 代码字体，留空用等宽系统字体栈

# ---------------------------------------------------------------- 文章页
article:
  excerpt: auto                  # 列表页摘要：auto(取 <!-- more --> 或前 N 字) | false(全文)
  excerpt_length: 200            # auto 模式截断字数
  more_link:                     # 「阅读全文」文案，留空用语言包
  toc:
    enable: true                 # 文章目录（桌面在左侧栏「目录」页签，移动端在抽屉里）
    min_depth: 2
    max_depth: 3
    list_number: true            # 是否显示 1.1 / 1.2 编号
    expand: false                # 移动端目录默认展开
    nowrap: false                # true = 长标题不换行（横向滚动）
  copyright: true                # 文末版权声明
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  lightbox: true                 # 图片点击放大（原生 <dialog>）
  lazyload: true                 # 图片懒加载 + decoding=async
  updated: true                  # 显示「最后更新」
  word_count: true               # 显示字数
  reading_time: true             # 显示预计阅读时间
  post_nav: true                 # 上一篇 / 下一篇
  share: [native, copy, weibo, twitter, telegram]   # 也可只留 [copy]，[] 关闭

# -------------------------------------------------------------------- 搜索
# 构建期把文章正文压成 search.json，前端原生 JS 本地搜索（不需要任何搜索插件）。
# 交互：放大镜 / 按 / 或 Ctrl+K 唤起浮层，↑↓ 选择，Enter 打开，Esc 关闭。
search:
  enable: true
  path: search.json
  limit: 20                      # 最多返回条数
  excerpt_length: 140            # 每条结果摘要字数
  preload: false                 # true = 页面加载即拉索引；false = 首次唤起搜索时拉
  shortcut: true                 # 按 / 或 Ctrl/Cmd+K 唤起

# -------------------------------------------------------------------- 评论
# 默认关闭：不填 provider 仓库信息就不会渲染任何评论区内容（页面里零痕迹，不留空白框）。
# 开启方法：enable: true + 填好 provider 对应的必填项（giscus 需要 repo / repo_id /
#           category_id，见下方说明）。
# ⚠️ 备案小贴士：ICP 备案类型为「非交互式」时不能有评论这类用户生成内容（UGC），
#    请保持 enable: false。
comments:
  enable: false
  lazyload: true                 # 滚到评论区才加载第三方脚本（首屏零请求）
  preload: false                 # false = 先显示一条「点击加载评论」细栏（复刻原版 click2show）
                                 # true  = 进入页面就展开
  collapsible: true              # 标题右侧「收起」按钮；收起后区块整块不占位，页脚自动上移
  provider: giscus               # giscus | waline | twikoo | disqus | valine | false
  hint:                          # 评论框上方提示，留空不显示
  # --- giscus：基于 GitHub Discussions，零服务器零成本 ---------------------
  # 两个 id 怎么拿：
  #   1) 给仓库装上 giscus App，并在仓库 Settings → General → Features 打开 Discussions
  #   2) 打开 https://giscus.app ，「仓库」填 用户名/仓库名
  #   3) 「Discussion 分类」选一个（默认 Announcements）
  #   4) 生成的 <script> 里 data-repo-id="R_xxx"、data-category-id="DIC_xxx" 抄到下面
  giscus:
    repo:                        # 形如 owner/repo，留空则评论不可用
    repo_id:
    category: Announcements
    category_id:
    mapping: pathname            # pathname | url | title | og:title | specific
    strict: false
    reactions_enabled: 1
    input_position: top          # top | bottom
    theme: preferred_color_scheme
    lang: zh-CN
    loading: lazy
  # --- 其它可选后端（配了才会用）-----------------------------------------
  waline:
    serverURL:
    lang: zh-CN
  twikoo:
    envId:
  disqus:
    shortname:
  valine:                        # 兼容旧数据；LeanCloud 国内版已不稳，建议迁移
    appid:
    appkey:
    serverURLs:

# -------------------------------------------------------------------- 页脚
footer:
  copyright: true                # 版权行：© <起始年>-<当前年> <profile.author>
  powered_by: true               # 署名行：Hexo · Yelee Next <version>（AkiSenn & MOxFIVE）
                                 #   署名与两个 GitHub 链接写死在模板里，不提供配置项
  custom:                        # 自定义 HTML，插在页脚最下方
  # ---- 备案区：两项互相独立，填了才显示（留空则整行不渲染，不留空白）------
  # ① 工信部备案 / 萌ICP
  icp:                           # 例如：京ICP备2026000000号-1 / 萌ICP备20260000号
  icp_link:                      # 留空则用 https://beian.miit.gov.cn/
  # ② 公安备案（公网安备）
  police_icp:                    # 例如：京公网安备11010502012345号
  police_icp_code:               # 编号，例如 11010502012345（police_icp_link 留空时自动拼查询链接）
  police_icp_link:               # 想手动指定查询链接才填
  police_icp_icon:               # 留空时自动探测 source/img/beian.png（公安部官方图标），
                                 #   探测不到则用内置盾牌 SVG
  runtime:                       # 「本站已运行 N 天」
    enable: true
    since:                       # 起始日期，例如 2020-08-25；留空则整块不显示
    text:                        # 自定义前缀文案，留空用语言包里的「本站已运行」
  visit_counter:                 # 访问统计（不蒜子），单独一行小字显示
    enable: true
    provider: busuanzi           # busuanzi | false
    today_pv: true               # 今日总访问量
    site_pv: true                # 本站总访问量
    today_uv: false              # 今日访客数
    site_uv: false               # 本站访客数
    page_pv: false               # 本页阅读量（只在文章页显示）
    page_uv: false               # 本页访客数（只在文章页显示）
    src:                         # 脚本地址，默认 //cdn.busuanzi.cc/busuanzi/3.6.9/busuanzi.min.js
    # 新版不蒜子的 api.php 会返回这些字段，脚本按「字段名 = 元素 id」直接回填：
    #   busuanzi_today_pv / busuanzi_today_uv / busuanzi_site_pv /
    #   busuanzi_site_uv / busuanzi_page_pv / busuanzi_page_uv
    # 注意：不蒜子会拒绝 localhost / 内网 IP（返回"域名/IP已被禁用"），上线后才看得到数字。

# -------------------------------------------------------------------- 数学
# 默认按文章 opt-in：front-matter 写 mathjax: true 才加载公式库，避免全站每页白拉
math:
  enable: true
  per_page: true
  engine: mathjax                # mathjax | katex
  mathjax:
    cdn: https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
    config:                      # 会序列化成 window.MathJax
      tex:
        inlineMath: [['$', '$'], ['\\(', '\\)']]
  katex:
    cdn: https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
    auto_render: https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
    css: https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

# ------------------------------------------------------------------ 统计
# 留空 = 完全不加载对应脚本（默认留空）
analytics:
  # GA4 的「衡量 ID」（形如 G-XXXXXXXXXX）：
  #   https://analytics.google.com → 管理 → 数据收集和修改 → 数据流 → 选你的网站
  #   → 右侧「衡量 ID」复制粘到这里。留空 = 完全不加载 GA。
  #   老的 UA-XXXXXXX-X 也认，但 Google 已停止处理 UA 数据，建议换 GA4。
  google_analytics:
  # 百度统计：https://tongji.baidu.com → 管理 → 代码获取 → 代码里 hm.js? 后面那串
  baidu_tongji:

# ------------------------------------------------------------------ 资源
assets:
  cdn:                           # 留空 = 自托管（推荐）；要 CDN 填 https://cdn.jsdelivr.net/gh/用户/仓库@v4
  fingerprint: true              # 内容指纹 /css/theme.css?v=<hash>，配合长缓存
  critical_css: true             # 内联关键 CSS，主样式表异步加载（去掉渲染阻塞）
  preconnect: []                 # 额外预连接域名，如 [https://giscus.app]

# ------------------------------------------------------------------ 性能
performance:
  minify_html: true              # 保守压缩 HTML（跳过 pre/script/style）
  instant_nav: true              # Speculation Rules：悬停即预渲染下一页
  generate_headers: false        # true = 生成 public/_headers（Cloudflare 长缓存规则）

# ---------------------------------------------------------------- SEO
seo:
  twitter_id:                    # 例如 yourname（不带 @）
  og_image:                      # 分享卡片大图，留空用头像
  json_ld: true                  # 输出 schema.org 结构化数据
  baidu_site:                    # 百度站长验证码（仅首页输出）
  google_site:                   # Google 站长验证码（仅首页输出）

# ---------------------------------------------------------------- 其他
open_in_new: true                # 站外链接新窗口打开（自动补 rel="noopener noreferrer"）
open_in_new_exclude: []          # 这些域名不处理，如 [example.com]
